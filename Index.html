<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- CDN Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- CDN Toastify per notifiche -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  
  <style>
    /* Ottimizzazioni per Tablet e Touch */
    input, button { min-height: 56px; font-size: 1.15rem; }
    
    /* Sfondo medico con overlay per massimo contrasto */
    .bg-medical {
      background-image: linear-gradient(rgba(240, 249, 255, 0.88), rgba(224, 242, 254, 0.95)), url('https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&q=80&w=2000');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* Animazione personalizzata per i pulsanti */
    .btn-animated {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-animated:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.4);
    }
    .btn-animated:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.3);
    }
  </style>
</head>
<body class="bg-medical text-slate-800 font-sans antialiased selection:bg-sky-200">

  <!-- ======================================================== -->
  <!-- MODULO DI AUTENTICAZIONE -->
  <!-- ======================================================== -->
  <div id="auth-module" class="min-h-screen flex items-center justify-center p-6">
    <!-- Card Principale -->
    <div class="bg-white/95 backdrop-blur-sm p-10 rounded-3xl shadow-2xl w-full max-w-xl border border-sky-100">
      
      <div class="text-center mb-10">
        <!-- Icona stilizzata (Croce medica / Salute) -->
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-sky-100 text-sky-600 mb-4 shadow-inner">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
        </div>
        <h1 class="text-3xl font-extrabold text-sky-900 tracking-tight mb-2">Sistema Vaccinale</h1>
        <p class="text-sky-600 font-medium text-lg">Area Riservata Operatori</p>
      </div>

      <!-- SEZIONE LOGIN -->
      <div id="login-section">
        <div class="space-y-6">
          <div>
            <label class="block text-sm font-bold mb-2 text-slate-700 uppercase tracking-wider">Email</label>
            <input type="email" id="login-email" class="w-full px-5 border-2 border-sky-100 rounded-2xl focus:ring-4 focus:ring-sky-100 focus:border-sky-500 outline-none transition-all bg-sky-50/50">
          </div>
          <div>
            <label class="block text-sm font-bold mb-2 text-slate-700 uppercase tracking-wider">Password</label>
            <input type="password" id="login-password" class="w-full px-5 border-2 border-sky-100 rounded-2xl focus:ring-4 focus:ring-sky-100 focus:border-sky-500 outline-none transition-all bg-sky-50/50">
          </div>
          <button onclick="handleLogin()" id="btn-login" class="btn-animated w-full bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold rounded-2xl text-xl mt-4">
            Accedi al Sistema
          </button>
        </div>
        
        <div class="mt-10 flex flex-col sm:flex-row justify-between text-base font-semibold gap-4">
          <button onclick="toggleSection('recover-section')" class="text-sky-600 hover:text-sky-800 transition-colors p-2 text-left">Password dimenticata?</button>
          <button onclick="toggleSection('register-section')" class="text-sky-600 hover:text-sky-800 transition-colors p-2 text-left sm:text-right">Nuova Utenza</button>
        </div>
      </div>

      <!-- SEZIONE REGISTRAZIONE -->
      <div id="register-section" class="hidden">
        <h2 class="text-2xl font-bold mb-6 text-sky-900 border-b-2 border-sky-100 pb-2">Registra Account</h2>
        <div class="space-y-5">
          <div class="flex gap-4">
            <div class="w-1/2">
              <label class="block text-xs font-bold mb-1 text-slate-500 uppercase">Nome</label>
              <input type="text" id="reg-nome" class="w-full px-4 border-2 border-sky-100 rounded-2xl focus:border-sky-500 outline-none bg-sky-50/50">
            </div>
            <div class="w-1/2">
              <label class="block text-xs font-bold mb-1 text-slate-500 uppercase">Cognome</label>
              <input type="text" id="reg-cognome" class="w-full px-4 border-2 border-sky-100 rounded-2xl focus:border-sky-500 outline-none bg-sky-50/50">
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold mb-1 text-slate-500 uppercase">Email</label>
            <input type="email" id="reg-email" class="w-full px-4 border-2 border-sky-100 rounded-2xl focus:border-sky-500 outline-none bg-sky-50/50">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1 text-slate-500 uppercase">Password</label>
            <input type="text" id="reg-password" placeholder="Min. 8 car., 1 numero, 1 car. speciale" class="w-full px-4 border-2 border-sky-100 rounded-2xl focus:border-sky-500 outline-none bg-sky-50/50">
            <p class="text-xs text-slate-400 mt-2 ml-2">Es: Vaccino_24!</p>
          </div>
          
          <button onclick="handleRegister()" id="btn-register" class="btn-animated w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold rounded-2xl text-lg mt-6">
            Registra e Continua
          </button>
          <button onclick="toggleSection('login-section')" class="w-full text-slate-500 hover:text-slate-800 p-3 rounded-xl mt-2 font-medium transition-colors">Torna al Login</button>
        </div>
      </div>

      <!-- SEZIONE RECUPERO -->
      <div id="recover-section" class="hidden">
        <h2 class="text-2xl font-bold mb-6 text-sky-900 border-b-2 border-sky-100 pb-2">Ripristino Password</h2>
        <p class="text-slate-600 mb-6 text-sm">Inserisci l'email associata al tuo account. Ti invieremo una password temporanea sicura.</p>
        <div class="space-y-6">
          <div>
            <label class="block text-sm font-bold mb-2 text-slate-700 uppercase">Email</label>
            <input type="email" id="recover-email" class="w-full px-5 border-2 border-sky-100 rounded-2xl focus:border-sky-500 outline-none bg-sky-50/50">
          </div>
          <button onclick="handleRecover()" id="btn-recover" class="btn-animated w-full bg-gradient-to-r from-amber-400 to-orange-500 text-white font-bold rounded-2xl text-lg">
            Invia Email di Reset
          </button>
          <button onclick="toggleSection('login-section')" class="w-full text-slate-500 hover:text-slate-800 p-3 rounded-xl mt-2 font-medium transition-colors">Annulla e Torna al Login</button>
        </div>
      </div>

    </div>
  </div>

  <!-- ======================================================== -->
  <!-- LA TUA APP ORIGINALE (Nascosta) -->
  <!-- ======================================================== -->
  <div id="main-app" class="hidden w-full min-h-screen flex flex-col bg-slate-50">
    <div class="bg-gradient-to-r from-sky-800 to-blue-900 text-white shadow-lg p-5 flex justify-between items-center shrink-0">
      <div class="font-bold text-2xl tracking-wide flex items-center gap-3">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        Consensi Vaccinali
      </div>
      <div class="flex items-center gap-6">
        <span id="user-display-name" class="hidden md:inline-block text-sky-100 font-medium text-lg"></span>
        <button onclick="logout()" class="btn-animated bg-white/20 hover:bg-white/30 px-6 py-3 rounded-xl font-bold transition-all backdrop-blur-sm">Disconnetti</button>
      </div>
    </div>
    
    <div class="p-6 flex-grow overflow-auto">
      <!-- INCOLLA QUI IL CODICE HTML DELLA TUA WEB APP ORIGINALE -->
    </div>
  </div>

  <script>
    // Notifiche UI
    function showToast(text, type = 'success') {
      let bgColor = type === 'error' ? "linear-gradient(to right, #f43f5e, #e11d48)" : "linear-gradient(to right, #0ea5e9, #0284c7)";
      Toastify({
        text: text,
        duration: 4000,
        gravity: "bottom",
        position: "center",
        style: {
          background: bgColor,
          borderRadius: "16px",
          padding: "18px 28px",
          fontSize: "1.15rem",
          fontWeight: "600",
          boxShadow: "0 20px 25px -5px rgba(0, 0, 0, 0.1)"
        }
      }).showToast();
    }

    function toggleSection(sectionId) {
      ['login-section', 'recover-section', 'register-section'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(sectionId).classList.remove('hidden');
    }

    // Validazione Password lato Front-end
    function validatePassword(password) {
      const minLength = password.length >= 8;
      const hasNumber = /\d/.test(password);
      const hasSpecial = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]+/.test(password);
      return minLength && hasNumber && hasSpecial;
    }

    // LOGIN
    function handleLogin() {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');
      
      if(!email || !pass) return showToast("Inserisci email e password", "error");
      
      btn.innerText = "Verifica credenziali...";
      btn.classList.add("opacity-75", "cursor-wait");

      google.script.run
        .withSuccessHandler(function(response) {
          btn.innerText = "Accedi al Sistema";
          btn.classList.remove("opacity-75", "cursor-wait");
          
          if(response.success) {
            showToast("Benvenuto/a, " + response.name);
            document.getElementById('auth-module').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = response.name;
            document.getElementById('login-password').value = "";
          } else {
            showToast(response.message, "error");
          }
        })
        .withFailureHandler(function(err) {
          btn.innerText = "Accedi al Sistema";
          btn.classList.remove("opacity-75", "cursor-wait");
          showToast("Errore di rete. Riprova.", "error");
        })
        .checkLogin(email, pass);
    }

    // REGISTRAZIONE
    function handleRegister() {
      const nome = document.getElementById('reg-nome').value.trim();
      const cognome = document.getElementById('reg-cognome').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-password').value;
      const btn = document.getElementById('btn-register');

      if(!nome || !cognome || !email || !pass) return showToast("Compila tutti i campi", "error");
      
      // Controllo sicurezza password lato client prima di inviare
      if(!validatePassword(pass)) {
        return showToast("La password deve contenere almeno 8 caratteri, un numero e un carattere speciale.", "error");
      }

      btn.innerText = "Creazione in corso...";
      btn.classList.add("opacity-75", "cursor-wait");

      google.script.run
        .withSuccessHandler(function(response) {
          btn.innerText = "Registra e Continua";
          btn.classList.remove("opacity-75", "cursor-wait");
          if(response.success) {
            showToast(response.message);
            toggleSection('login-section');
            document.getElementById('login-email').value = email;
            // Pulisci campi
            document.getElementById('reg-nome').value = "";
            document.getElementById('reg-cognome').value = "";
            document.getElementById('reg-email').value = "";
            document.getElementById('reg-password').value = "";
          } else {
            showToast(response.message, "error");
          }
        })
        .registerUser(nome, cognome, email, pass);
    }

    // RECUPERO PASSWORD (Genera e invia reset temporaneo)
    function handleRecover() {
      const email = document.getElementById('recover-email').value.trim();
      const btn = document.getElementById('btn-recover');

      if(!email) return showToast("Inserisci la tua email", "error");

      btn.innerText = "Elaborazione in corso...";
      btn.classList.add("opacity-75", "cursor-wait");

      google.script.run
        .withSuccessHandler(function(response) {
          btn.innerText = "Invia Email di Reset";
          btn.classList.remove("opacity-75", "cursor-wait");
          if(response.success) {
            showToast(response.message);
            toggleSection('login-section');
            document.getElementById('recover-email').value = "";
          } else {
            showToast(response.message, "error");
          }
        })
        .recoverPassword(email);
    }

    // LOGOUT
    function logout() {
      document.getElementById('main-app').classList.add('hidden');
      document.getElementById('auth-module').classList.remove('hidden');
      showToast("Disconnessione avvenuta con successo");
      google.script.run.logAction(document.getElementById('user-display-name').innerText, 'Logout effettuato');
    }
  </script>
</body>
</html>
